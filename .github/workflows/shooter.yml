name: Update Contribution Shooter SVG

on:
  schedule:
    - cron: "0 0 * * *"   # tiap hari jam 00:00 UTC
  workflow_dispatch: {}     # bisa juga dijalankan manual dari tab Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: node scripts/shootingShip.js

      - name: Commit & push jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/contribution-shooter.svg
          git diff --cached --quiet || git commit -m "chore: update contribution shooter svg"
          git push
